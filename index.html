<!DOCTYPE html>
<html>
<head>
    <title>Mine Subsidence Monitoring</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Mine Subsidence Monitoring System</h1>

    <div class="dashboard">

        <div class="card">
            <h2>Distance</h2>
            <p id="distance">-- cm</p>
        </div>

        <div class="card">
            <h2>Displacement</h2>
            <p id="displacement">-- cm</p>
        </div>

        <div class="card">
            <h2>Ground Tilt</h2>
            <p id="tilt">-- °</p>
        </div>

        <div class="card">
            <h2>Movement Rate</h2>
            <p id="rate">-- cm/min</p>
        </div>

        <div class="card">
            <h2>Risk Level</h2>
            <p id="risk">--</p>
        </div>

        <div class="card">
            <h2>Time to Threshold</h2>
            <p id="time">-- min</p>
        </div>

    </div>

    <p id="status">Connecting...</p>

    <script src="script.js"></script>

</body>
</html>
